<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="popup.css" />
</head>
<body class="bg-light">
    <div class="container-fluid py-3" style="max-width: 1280px;">
        <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-2">
            <div>
                <div class="h5 fw-bold mb-0">Activity Log</div>
                <div class="small text-secondary">Lịch sử thao tác trong popup.</div>
            </div>
            <div class="d-flex gap-2 flex-wrap align-items-center">
                <input id="log_search" class="form-control form-control-sm" type="text" placeholder="Tìm kiếm..." style="width: 240px;" />
                <select id="log_kind" class="form-select form-select-sm" style="width: 180px;">
                    <option value="">Tất cả loại</option>
                    <option value="ui">ui</option>
                    <option value="action">action</option>
                    <option value="compare">compare</option>
                    <option value="append">append</option>
                    <option value="export">export</option>
                    <option value="history">history</option>
                    <option value="data">data</option>
                </select>
                <button id="btn_log_refresh" class="btn btn-sm btn-primary" type="button">REFRESH</button>
                <button id="btn_log_clear" class="btn btn-sm btn-outline-danger" type="button">CLEAR</button>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-sm table-bordered align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 170px;">Thời gian</th>
                            <th style="width: 120px;">Loại</th>
                            <th>Message</th>
                            <th style="width: 45%;">Data</th>
                        </tr>
                    </thead>
                    <tbody id="log_tbody"></tbody>
                </table>
            </div>
        </div>
        <div id="log_hint" class="small text-secondary mt-2"></div>
    </div>
    <script type="module" src="log.js"></script>
</body>
</html>
